<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Fade Clock</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iPad Clock" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <style>
    @font-face {
      font-family: "Nanum Gothic";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/NanumGothic-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Nanum Gothic";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/NanumGothic-Bold.ttf") format("truetype");
    }

    body {
      background-color: #080d1b;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Nanum Gothic", -apple-system, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* --- 1. 페이드 애니메이션 정의  --- */
    @keyframes fadeInEffect {
      0% {
        opacity: 0.2;
        transform: translateY(5px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-animate {
      animation: fadeInEffect 0.4s ease-out forwards;
    }

    /* Static gradients + opacity/transform only, including Safari on iOS 12. */
    #ambient-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 960px;
      height: 880px;
      transform: translate(-50%, -50%);
      z-index: -1;
      pointer-events: none;
    }

    .ambient-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      mix-blend-mode: screen;
      animation: ambientCycle 90s ease-in-out infinite;
      will-change: opacity, transform;
    }

    .glow-aqua {
      background: radial-gradient(ellipse 360px 330px at 38% 45%, rgba(110, 210, 225, 0.82) 0%, rgba(110, 210, 225, 0.68) 18%, rgba(110, 210, 225, 0.43) 38%, rgba(110, 210, 225, 0.21) 58%, rgba(110, 210, 225, 0.065) 78%, rgba(110, 210, 225, 0) 100%);
    }
    .glow-lilac {
      background: radial-gradient(ellipse 360px 330px at 60% 40%, rgba(185, 155, 255, 0.82) 0%, rgba(185, 155, 255, 0.68) 18%, rgba(185, 155, 255, 0.43) 38%, rgba(185, 155, 255, 0.21) 58%, rgba(185, 155, 255, 0.065) 78%, rgba(185, 155, 255, 0) 100%);
      animation-delay: -60s;
    }
    .glow-peach {
      background: radial-gradient(ellipse 360px 330px at 52% 62%, rgba(255, 185, 135, 0.82) 0%, rgba(255, 185, 135, 0.68) 18%, rgba(255, 185, 135, 0.43) 38%, rgba(255, 185, 135, 0.21) 58%, rgba(255, 185, 135, 0.065) 78%, rgba(255, 185, 135, 0) 100%);
      animation-delay: -30s;
    }

    @keyframes ambientCycle {
      0%, 100% { opacity: 1; transform: translate(-16px, -10px) scale(1.04); }
      33.333% { opacity: 0.24; transform: translate(20px, -6px) scale(0.96); }
      66.667% { opacity: 0.24; transform: translate(-4px, 18px) scale(1.08); }
    }

    @media (prefers-reduced-motion: reduce) {
      .ambient-glow { animation: none; opacity: 0.4; will-change: auto; }
      .fade-animate { animation: none; }
    }

    /* --- 3. 시계 UI --- */
    #clock-wrapper {
      position: absolute;
      top: 70%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      z-index: 10;
    }

    #calendar-row {
      position: absolute;
      left: 50%;
      top: 35%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      white-space: nowrap;
      z-index: 11;
    }
    .side-calendar {
      width: 180px;
      margin: 0 9.6px;
      color: #a7adbb;
    }
    .side-calendar table {
      width: 100%;
      table-layout: fixed;
      border-collapse: collapse;
      text-align: center;
    }
    .side-calendar caption {
      color: #b8becb;
      font-size: 15px;
      padding-bottom: 12px;
    }
    .side-calendar th { font-size: 11px; font-weight: 400; height: 24px; }
    .side-calendar td { font-size: 12px; height: 26px; padding: 0; }
    #calendar {
      width: 336px;
      box-sizing: border-box;
      padding: 20px 24px 16px;
      margin-bottom: 0;
      color: #d4dff2;
    }
    #calendar table {
      width: 210px;
      margin: 0 auto;
      table-layout: fixed;
      border-collapse: collapse;
      text-align: center;
    }
    #calendar-title {
      color: #e1e9f8;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      padding-bottom: 16px;
    }
    #calendar th {
      height: 28px;
      font-size: 13px;
      font-weight: 700;
      color: #9eafca;
    }
    #calendar td { height: 28px; padding: 0; font-size: 16px; font-weight: 700; }
    #calendar .sunday { color: #f0b7ad; }
    #calendar .saturday { color: #acccf5; }
    #calendar .calendar-day {
      display: inline-block;
      width: 26px;
      height: 26px;
      line-height: 26px;
      border-radius: 50%;
    }
    #calendar .today .calendar-day {
      color: #f5f8ff;
      font-weight: 700;
      background: rgba(163, 140, 255, 0.4);
      box-shadow: inset 0 0 0 1px rgba(216, 207, 255, 0.6);
    }

    @media (max-width: 850px) {
      #calendar { width: 312px; }
      .side-calendar { width: 152px; margin: 0 6px; }
    }

    #date-display {
      color: #d4dff2;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 18px;
      letter-spacing: 1px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .clock-container {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ampm {
      position: relative;
      width: 50px;
      height: 30px;
      margin-right: 20px;
      align-self: flex-end;
      padding-bottom: 18px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    #ampm-label {
      color: #b9cbe9;
      font-size: 30px;
      font-weight: 700;
      white-space: nowrap;
    }

    .card {
      color: #ffffff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      width: 65px;
      height: 100px;
      font-size: 100px;
      line-height: 1;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      will-change: transform, opacity;
    }

    .colon {
      width: 50px;
      padding-bottom: 10px;
      font-size: 80px;
      font-weight: 400;
    }

    /* --- UI 컨트롤 --- */
    #menu-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(30, 43, 64, 0.65);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-appearance: none;
      appearance: none;
      z-index: 200;
      cursor: pointer;
      border: 1px solid rgba(185, 203, 233, 0.25);
    }

    #controls {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(16, 25, 43, 0.96);
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 520px;
      box-sizing: border-box;
      max-height: calc(100vh - 120px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1px solid rgba(185, 203, 233, 0.22);
      z-index: 300;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #d4dff2;
    }

    .control-columns {
      display: flex;
      margin: 0 -10px;
    }
    .control-column {
      width: 50%;
      min-width: 0;
      box-sizing: border-box;
      padding: 0 10px;
    }
    .control-column .control-row {
      flex-direction: column;
    }
    .control-row label {
      font-size: 14px;
      margin-bottom: 8px;
    }
    input[type="range"] {
      width: 100%;
      margin: 0;
      min-height: 28px;
    }
    .control-column .vertical-control {
      flex-direction: row;
      align-items: center;
      justify-content: center;
    }
    .vertical-control label {
      margin: 0 12px 0 0;
      white-space: nowrap;
    }
    .vertical-slider {
      position: relative;
      width: 44px;
      height: 140px;
      flex-shrink: 0;
    }
    /* Rotate a native horizontal range for Safari on iOS 12.
       +90deg puts minimum (top: 0%) at the top, maximum at the bottom. */
    .vertical-slider input[type="range"] {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 128px;
      height: 32px;
      transform: translate(-50%, -50%) rotate(90deg);
    }
    .shared-control {
      flex-direction: column;
      align-items: center;
      width: 70%;
      margin: 4px auto 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      background: #263854;
      color: white;
      margin-top: 5px;
    }
  </style>
</head>

<body>
    <div id="calendar-row">
      <section class="side-calendar" aria-label="이전 달 달력">
        <table>
          <caption id="previous-calendar-title"></caption>
          <thead><tr><th scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th><th scope="col">토</th></tr></thead>
          <tbody id="previous-calendar-days"></tbody>
        </table>
      </section>
    <section id="calendar" aria-label="이번 달 달력">
      <table>
        <caption id="calendar-title"></caption>
        <thead><tr>
          <th scope="col" class="sunday">일</th><th scope="col">월</th>
          <th scope="col">화</th><th scope="col">수</th><th scope="col">목</th>
          <th scope="col">금</th><th scope="col" class="saturday">토</th>
        </tr></thead>
        <tbody id="calendar-days"></tbody>
      </table>
    </section>
      <section class="side-calendar" aria-label="다음 달 달력">
        <table>
          <caption id="next-calendar-title"></caption>
          <thead><tr><th scope="col">일</th><th scope="col">월</th><th scope="col">화</th><th scope="col">수</th><th scope="col">목</th><th scope="col">금</th><th scope="col">토</th></tr></thead>
          <tbody id="next-calendar-days"></tbody>
        </table>
      </section>
    </div>
  <div id="clock-wrapper">
    <div id="date-display">0000. 00. 00</div>
    <div class="clock-container">
      <div id="ambient-bg" aria-hidden="true">
    <div class="ambient-glow glow-aqua"></div>
    <div class="ambient-glow glow-lilac"></div>
    <div class="ambient-glow glow-peach"></div>
  </div>
      <div id="ampm"><span id="ampm-label">오전</span></div>
      <div class="card" id="h1">1</div>
      <div class="card" id="h2">2</div>
      <div class="card colon">:</div>
      <div class="card" id="m1">0</div>
      <div class="card" id="m2">0</div>
      <div class="card colon">:</div>
      <div class="card" id="s1">0</div>
      <div class="card" id="s2">0</div>
    </div>
  </div>

  <button id="menu-btn" type="button" aria-label="설정 열기" aria-controls="controls" aria-expanded="false" title="설정 · 드래그하여 이동">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="pointer-events: none">
      <path d="M4 7h16M4 17h16" />
      <circle cx="9" cy="7" r="2.5" fill="#1e2b40" />
      <circle cx="15" cy="17" r="2.5" fill="#1e2b40" />
    </svg>
  </button>

  <div id="controls">
    <div class="control-columns">
      <div class="control-column">
    <div class="control-row">
      <label for="sizeRange">시계 크기</label>
      <input type="range" id="sizeRange" min="0.4" max="2.0" step="0.01" value="1.0" />
    </div>
    <div class="control-row vertical-control">
      <label for="yRange">시계 세로</label>
      <div class="vertical-slider">
        <input type="range" id="yRange" min="0" max="100" value="70" aria-orientation="vertical" />
      </div>
    </div>
      </div>
      <div class="control-column">
    <div class="control-row">
      <label for="calendarSizeRange">달력 크기</label>
      <input type="range" id="calendarSizeRange" min="0.4" max="2.0" step="0.01" value="1.0" />
    </div>
    <div class="control-row vertical-control">
      <label for="calendarYRange">달력 세로</label>
      <div class="vertical-slider">
        <input type="range" id="calendarYRange" min="0" max="100" value="35" aria-orientation="vertical" />
      </div>
    </div>
      </div>
    </div>
    <div class="control-row shared-control">
      <label for="xRange">공통 가로</label>
      <input type="range" id="xRange" min="0" max="100" value="50" />
    </div>
    <button id="reset-btn" type="button" onclick="resetLayout()">위치·크기 초기화</button>
    <button id="close-btn" onclick="toggleMenu()">닫기</button>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      // Refresh an existing installation once the complete new cache is ready.
      const hadController = Boolean(navigator.serviceWorker.controller);
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch((e) => console.log(e))
      );
    }

    function updateElementWithFade(elementId, newValue) {
      const el = document.getElementById(elementId);
      if (!el) return;

      if (el.innerText !== newValue) {
        el.innerText = newValue;
        el.classList.remove("fade-animate");
        void el.offsetWidth;
        el.classList.add("fade-animate");
      }
    }

    const dayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

    // Local calendar arithmetic: no server, locale package, or network needed.
    let calendarDayKey = "";
    function updateCalendar(now) {
      const year = now.getFullYear();
      const month = now.getMonth();
      const today = now.getDate();
      const key = year + "-" + month + "-" + today;
      if (key === calendarDayKey) return;
      renderCalendarMonth("previous-calendar", year, month - 1, 0);
      renderCalendarMonth("calendar", year, month, today);
      renderCalendarMonth("next-calendar", year, month + 1, 0);
      calendarDayKey = key;
    }

    function renderCalendarMonth(prefix, year, month, today) {
      const first = new Date(year, month, 1);
      year = first.getFullYear();
      month = first.getMonth();
      const firstWeekday = first.getDay();
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      let rows = "";
      // Six rows keep the clock in place when the month changes.
      for (let row = 0; row < 6; row++) {
        rows += "<tr>";
        for (let column = 0; column < 7; column++) {
          const day = row * 7 + column - firstWeekday + 1;
          if (day < 1 || day > daysInMonth) {
            rows += '<td aria-hidden="true"></td>';
          } else {
            const weekend = column === 0 ? "sunday" : column === 6 ? "saturday" : "";
            const isToday = day === today;
            rows += '<td class="' + weekend + (isToday ? ' today' : '') + '"' +
              (isToday ? ' aria-current="date"' : '') + '><span class="calendar-day">' + day + '</span></td>';
          }
        }
        rows += "</tr>";
      }
      document.getElementById(prefix + "-title").textContent = year + "년 " + (month + 1) + "월";
      document.getElementById(prefix + "-days").innerHTML = rows;
    }

    function updateClock() {
      const now = new Date();
      updateCalendar(now);

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const date = String(now.getDate()).padStart(2, "0");
      const day = dayNames[now.getDay()];

      const dateDisplay = document.getElementById("date-display");
      if (dateDisplay) dateDisplay.innerText = `${year}. ${month}. ${date} ${day}`;

      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("ampm-label").innerText = h < 12 ? "오전" : "오후";
      h = h === 0 || h === 12 ? h : h % 12;
      const hStr = String(h).padStart(2, "0");

      updateElementWithFade("h1", hStr[0]);
      updateElementWithFade("h2", hStr[1]);
      updateElementWithFade("m1", m[0]);
      updateElementWithFade("m2", m[1]);
      updateElementWithFade("s1", s[0]);
      updateElementWithFade("s2", s[1]);
    }

    setInterval(updateClock, 1000);
    window.addEventListener("pageshow", updateClock);
    window.addEventListener("focus", updateClock);
    updateClock();

    // UI 컨트롤 및 설정 저장 로직
    const wrapper = document.getElementById("clock-wrapper");
    const sizeRange = document.getElementById("sizeRange");
    const xRange = document.getElementById("xRange");
    const yRange = document.getElementById("yRange");
    const calendarWrapper = document.getElementById("calendar-row");
    const calendarSizeRange = document.getElementById("calendarSizeRange");
    const calendarYRange = document.getElementById("calendarYRange");

    // Safari can deny storage access; the clock and controls should still run.
    try {
      if(localStorage.getItem('clockSize')) sizeRange.value = localStorage.getItem('clockSize');
      if(localStorage.getItem('clockX')) xRange.value = localStorage.getItem('clockX');
      if (localStorage.getItem('splitLayout') === '1') {
        if(localStorage.getItem('clockY')) yRange.value = localStorage.getItem('clockY');
        if(localStorage.getItem('calendarSize')) calendarSizeRange.value = localStorage.getItem('calendarSize');
        if(localStorage.getItem('calendarY')) calendarYRange.value = localStorage.getItem('calendarY');
      } else {
        // Preserve shared settings while separating the old group's vertical position.
        const oldY = Number(localStorage.getItem('clockY') || '50');
        yRange.value = String(Math.max(0, Math.min(100, oldY + 20)));
        calendarYRange.value = String(Math.max(0, Math.min(100, oldY - 15)));
        calendarSizeRange.value = sizeRange.value;
      }
    } catch (e) { /* Use defaults when storage is unavailable. */ }

    function addMultiListener(element, events, func) {
      events.split(" ").forEach((e) => element.addEventListener(e, func));
    }

    function updateTransform() {
      const x = xRange.value;
      const y = yRange.value;
      const scale = sizeRange.value;

      wrapper.style.left = x + "%";
      wrapper.style.top = y + "%";
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;

      calendarWrapper.style.left = x + "%";
      calendarWrapper.style.top = calendarYRange.value + "%";
      calendarWrapper.style.transform = `translate(-50%, -50%) scale(${calendarSizeRange.value})`;

      // 설정값 브라우저에 저장
      try {
        localStorage.setItem('clockSize', scale);
        localStorage.setItem('clockX', x);
        localStorage.setItem('clockY', y);
        localStorage.setItem('calendarSize', calendarSizeRange.value);
        localStorage.setItem('calendarY', calendarYRange.value);
        localStorage.setItem('splitLayout', '1');
      } catch (e) { /* Controls also work without persistent storage. */ }
    }

    // 초기 적용
    updateTransform();

    addMultiListener(sizeRange, "input change", updateTransform);
    addMultiListener(xRange, "input change", updateTransform);
    addMultiListener(yRange, "input change", updateTransform);
    addMultiListener(calendarSizeRange, "input change", updateTransform);
    addMultiListener(calendarYRange, "input change", updateTransform);
    [yRange, calendarYRange].forEach((slider) => {
      slider.addEventListener("keydown", (event) => {
        if (event.key !== "ArrowUp" && event.key !== "ArrowDown") return;
        event.preventDefault();
        const step = event.key === "ArrowUp" ? -1 : 1;
        slider.value = String(Math.max(0, Math.min(100, Number(slider.value) + step)));
        updateTransform();
      });
    });

    const controls = document.getElementById("controls");
    const menuBtn = document.getElementById("menu-btn");
    let isMenuOpen = false;

    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      menuBtn.setAttribute("aria-expanded", String(isMenuOpen));
      if (isMenuOpen) {
        controls.style.display = "block";
        menuBtn.style.display = "none";
      } else {
        controls.style.display = "none";
        menuBtn.style.display = "flex";
        menuBtn.focus();
      }
    }

    // Store a relative position so it remains visible after iPad rotation.
    const menuPositionKey = "clockMenuPosition";
    let menuPosition = null;
    try {
      const saved = JSON.parse(localStorage.getItem(menuPositionKey));
      if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
        menuPosition = saved;
      }
    } catch (e) { /* Ignore unavailable storage or invalid saved data. */ }

    function menuBounds() {
      return {
        x: Math.max(0, window.innerWidth - 50),
        y: Math.max(0, window.innerHeight - 50),
      };
    }

    function placeMenu(x, y) {
      const bounds = menuBounds();
      x = Math.max(0, Math.min(bounds.x, x));
      y = Math.max(0, Math.min(bounds.y, y));
      menuBtn.style.right = "auto";
      menuBtn.style.left = x + "px";
      menuBtn.style.top = y + "px";
      return { x: bounds.x ? x / bounds.x : 0, y: bounds.y ? y / bounds.y : 0 };
    }

    function restoreMenuPosition() {
      const bounds = menuBounds();
      if (menuPosition) {
        menuPosition = placeMenu(menuPosition.x * bounds.x, menuPosition.y * bounds.y);
      } else {
        placeMenu(bounds.x - 20, 20);
      }
    }
    restoreMenuPosition();
    window.addEventListener("resize", restoreMenuPosition);

    function resetLayout() {
      sizeRange.value = "1";
      xRange.value = "50";
      yRange.value = "70";
      calendarSizeRange.value = "1";
      calendarYRange.value = "35";
      updateTransform();
      menuPosition = null;
      restoreMenuPosition();
      try { localStorage.removeItem(menuPositionKey); }
      catch (e) { /* Reset still applies when storage is unavailable. */ }
    }


    // Touch Events are required on iOS 12 (Pointer Events arrived later).
    let drag = null;
    let suppressClick = false;
    let lastTouchTime = 0;

    function startMenuDrag(id, x, y) {
      if (drag) return;
      const rect = menuBtn.getBoundingClientRect();
      suppressClick = false;
      drag = { id: id, x: x, y: y, left: rect.left, top: rect.top, moved: false };
    }
    function moveMenuDrag(id, x, y) {
      if (!drag || drag.id !== id) return;
      const dx = x - drag.x;
      const dy = y - drag.y;
      if (!drag.moved && Math.sqrt(dx * dx + dy * dy) < 6) return;
      drag.moved = true;
      suppressClick = true;
      menuPosition = placeMenu(drag.left + dx, drag.top + dy);
    }
    function finishMenuDrag(id) {
      if (!drag || drag.id !== id) return;
      if (drag.moved) {
        try { localStorage.setItem(menuPositionKey, JSON.stringify(menuPosition)); }
        catch (e) { /* Dragging still works when storage is unavailable. */ }
      }
      drag = null;
    }
    function findTouch(touches, id) {
      for (let i = 0; i < touches.length; i++) {
        if (touches[i].identifier === id) return touches[i];
      }
      return null;
    }
    menuBtn.addEventListener("touchstart", (event) => {
      if (drag || event.touches.length !== 1) return;
      // Handle taps ourselves to avoid synthetic mouse/click events on Safari.
      event.preventDefault();
      lastTouchTime = Date.now();
      const touch = event.changedTouches[0];
      startMenuDrag(touch.identifier, touch.clientX, touch.clientY);
    }, { passive: false });
    window.addEventListener("touchmove", (event) => {
      if (!drag || drag.id === "mouse") return;
      const touch = findTouch(event.changedTouches, drag.id);
      if (!touch) return;
      event.preventDefault();
      moveMenuDrag(touch.identifier, touch.clientX, touch.clientY);
    }, { passive: false });
    window.addEventListener("touchend", (event) => {
      if (!drag || drag.id === "mouse") return;
      const touch = findTouch(event.changedTouches, drag.id);
      if (!touch) return;
      event.preventDefault();
      lastTouchTime = Date.now();
      const tapped = !drag.moved;
      finishMenuDrag(touch.identifier);
      if (tapped) toggleMenu();
    }, { passive: false });
    window.addEventListener("touchcancel", (event) => {
      if (!drag || !findTouch(event.changedTouches, drag.id)) return;
      lastTouchTime = Date.now();
      suppressClick = true;
      finishMenuDrag(drag.id);
    });
    menuBtn.addEventListener("mousedown", (event) => {
      if (event.button !== 0 || Date.now() - lastTouchTime < 800) return;
      event.preventDefault();
      startMenuDrag("mouse", event.clientX, event.clientY);
    });
    window.addEventListener("mousemove", (event) => {
      moveMenuDrag("mouse", event.clientX, event.clientY);
    });
    window.addEventListener("mouseup", () => finishMenuDrag("mouse"));
    window.addEventListener("blur", () => {
      if (drag) {
        suppressClick = true;
        finishMenuDrag(drag.id);
      }
    });
    menuBtn.addEventListener("click", (event) => {
      // Keep keyboard activation, but ignore clicks synthesized after a touch/drag.
      if (event.detail !== 0 && (suppressClick || Date.now() - lastTouchTime < 800)) {
        event.preventDefault();
        return;
      }
      toggleMenu();
    });
  </script>
</body>

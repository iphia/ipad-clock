<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Fade Clock</title>

  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="iPad Clock" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <style>
    @font-face {
      font-family: "Nanum Gothic";
      font-style: normal;
      font-weight: 400;
      font-display: swap;
      src: url("fonts/NanumGothic-Regular.ttf") format("truetype");
    }
    @font-face {
      font-family: "Nanum Gothic";
      font-style: normal;
      font-weight: 700;
      font-display: swap;
      src: url("fonts/NanumGothic-Bold.ttf") format("truetype");
    }
:root {
  --night-color: 120, 150, 230;      /* 밤 */
  --dawn-color: 125, 160, 200;       /* 새벽 */
  --morning-color: 190, 145, 100;    /* 아침 */
  --noon-color: 220, 145, 115;       /* 낮: */
  --afternoon-color: 180, 145, 125;  /* 오후 */
  --evening-color: 110, 145, 200;    /* 저녁 */
}

    body {
      background-color: #000000;
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: "Nanum Gothic", -apple-system, sans-serif;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    /* --- 1. 페이드 애니메이션 정의  --- */
    @keyframes fadeInEffect {
      0% {
        opacity: 0.2;
        transform: translateY(5px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fade-animate {
      animation: fadeInEffect 0.4s ease-out forwards;
    }

    /* --- 2. 배경 (크로스페이드용) --- */
    #crossfade-bg {
      position: absolute;
      top: 50%;
      left: 50%;
      /* 배경 원 크기를 800px에서 600px로 줄임 */
      width: 600px;
      height: 600px;
      transform: translate(-50%, -50%);
      z-index: 1;
      opacity: 1;
      transform-origin: center;
    }

    .bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 5s ease;
    }

    /* 6구간 테마 */
    #bg-dawn .petal {
      background: radial-gradient(circle, rgba(var(--dawn-color), 0.3) 0%, rgba(var(--dawn-color), 0) 70%);
    }
    #bg-morning .petal {
      background: radial-gradient(circle, rgba(var(--morning-color), 0.3) 0%, rgba(var(--morning-color), 0) 70%);
    }
    #bg-noon .petal {
      background: radial-gradient(circle, rgba(var(--noon-color), 0.3) 0%, rgba(var(--noon-color), 0) 70%);
    }
    #bg-afternoon .petal {
      background: radial-gradient(circle, rgba(var(--afternoon-color), 0.3) 0%, rgba(var(--afternoon-color), 0) 70%);
    }
    #bg-evening .petal {
      background: radial-gradient(circle, rgba(var(--evening-color), 0.3) 0%, rgba(var(--evening-color), 0) 70%);
    }
    #bg-night .petal {
      background: radial-gradient(circle, rgba(var(--night-color), 0.3) 0%, rgba(var(--night-color), 0) 70%);
    }

    .petal {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      mix-blend-mode: screen;
      transform-origin: center;
    }

    /* --- 3. 시계 UI --- */
    #clock-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      white-space: nowrap;
      z-index: 10;
    }

    #date-display {
      color: #dddddd;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 20px;
      letter-spacing: 1px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .clock-container {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #ampm {
      position: relative;
      width: 50px;
      height: 30px;
      margin-right: 20px;
      align-self: flex-end;
      padding-bottom: 18px;
      text-shadow: 0 2px 5px rgba(0, 0, 0, 0.8);
    }

    .ampm-layer {
      position: absolute;
      top: 0;
      left: 0;
      font-size: 30px;
      font-weight: 700;
      white-space: nowrap;
      transition: opacity 5s ease;
    }

    /* 6구간 라벨 색상 */
    #label-dawn { color: rgba(var(--dawn-color), 0.95); }
    #label-morning { color: rgba(var(--morning-color), 0.95); }
    #label-noon { color: rgba(var(--noon-color), 0.95); }
    #label-afternoon { color: rgba(var(--afternoon-color), 0.95); }
    #label-evening { color: rgba(var(--evening-color), 0.95); }
    #label-night { color: rgba(var(--night-color), 0.95); }

    .card {
      color: #ffffff;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 700;
      width: 65px;
      height: 100px;
      font-size: 100px;
      line-height: 1;
      text-shadow: 0 4px 10px rgba(0, 0, 0, 0.8);
      will-change: transform, opacity;
    }

    .colon {
      width: 50px;
      padding-bottom: 10px;
      font-size: 80px;
      font-weight: 400;
    }

    /* --- UI 컨트롤 --- */
    #menu-btn {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 50px;
      height: 50px;
      background: rgba(50, 50, 50, 0.5);
      border-radius: 50%;
      color: white;
      font-size: 24px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin: 0;
      box-sizing: border-box;
      touch-action: none;
      -webkit-appearance: none;
      appearance: none;
      z-index: 200;
      cursor: pointer;
      border: 1px solid #555;
    }

    #controls {
      display: none;
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.95);
      padding: 20px;
      border-radius: 10px;
      width: 80%;
      max-width: 300px;
      border: 1px solid #444;
      z-index: 300;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 15px;
      color: #ddd;
    }

    input[type="range"] {
      width: 60%;
    }

    button {
      width: 100%;
      padding: 15px;
      border-radius: 8px;
      border: none;
      background: #333;
      color: white;
      margin-top: 5px;
    }
  </style>
</head>

<body>
  <div id="crossfade-bg">
    <div class="bg-layer" id="bg-dawn" style="opacity: 1">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
    <div class="bg-layer" id="bg-morning">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
    <div class="bg-layer" id="bg-noon">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
    <div class="bg-layer" id="bg-afternoon">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
    <div class="bg-layer" id="bg-evening">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
    <div class="bg-layer" id="bg-night">
      <div class="petal"></div>
      <div class="petal"></div>
      <div class="petal"></div>
    </div>
  </div>

  <div id="clock-wrapper">
    <div id="date-display">0000. 00. 00</div>
    <div class="clock-container">
      <div id="ampm">
        <div class="ampm-layer" id="label-dawn" style="opacity: 1">오전</div>
        <div class="ampm-layer" id="label-morning">오전</div>
        <div class="ampm-layer" id="label-noon">오후</div>
        <div class="ampm-layer" id="label-afternoon">오후</div>
        <div class="ampm-layer" id="label-evening">오후</div>
        <div class="ampm-layer" id="label-night">오전</div>
      </div>
      <div class="card" id="h1">1</div>
      <div class="card" id="h2">2</div>
      <div class="card colon">:</div>
      <div class="card" id="m1">0</div>
      <div class="card" id="m2">0</div>
      <div class="card colon">:</div>
      <div class="card" id="s1">0</div>
      <div class="card" id="s2">0</div>
    </div>
  </div>

  <button id="menu-btn" type="button" aria-label="설정 열기" aria-controls="controls" aria-expanded="false" title="설정 · 드래그하여 이동">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" style="pointer-events: none">
      <path d="M4 7h16M4 17h16" />
      <circle cx="9" cy="7" r="2.5" fill="#222" />
      <circle cx="15" cy="17" r="2.5" fill="#222" />
    </svg>
  </button>

  <div id="controls">
    <div class="control-row">
      <span>크기</span>
      <input type="range" id="sizeRange" min="0.4" max="2.0" step="0.01" value="1.0" />
    </div>
    <div class="control-row">
      <span>가로</span>
      <input type="range" id="xRange" min="0" max="100" value="50" />
    </div>
    <div class="control-row">
      <span>세로</span>
      <input type="range" id="yRange" min="0" max="100" value="50" />
    </div>
    <button id="close-btn" onclick="toggleMenu()">닫기</button>
  </div>

  <script>
    if ("serviceWorker" in navigator) {
      // Refresh an existing installation once the complete new cache is ready.
      const hadController = Boolean(navigator.serviceWorker.controller);
      let refreshing = false;
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (hadController && !refreshing) {
          refreshing = true;
          window.location.reload();
        }
      });
      window.addEventListener("load", () =>
        navigator.serviceWorker.register("sw.js").catch((e) => console.log(e))
      );
    }

    // --- [테스트용 변수] ---
    // 현재 시간에 더할 시간(시 단위)을 여기에 입력해! 
    // 예: 5를 입력하면 현재 시간보다 5시간 뒤의 테마와 시간이 나옴. (음수도 가능)
    const timeOffsetHours = 0; 

    function updateElementWithFade(elementId, newValue) {
      const el = document.getElementById(elementId);
      if (!el) return;

      if (el.innerText !== newValue) {
        el.innerText = newValue;
        el.classList.remove("fade-animate");
        void el.offsetWidth;
        el.classList.add("fade-animate");
      }
    }

    const dayNames = ["일요일", "월요일", "화요일", "수요일", "목요일", "금요일", "토요일"];

    function updateClock() {
      const now = new Date();
      
      // 테스트용 오프셋 적용
      now.setHours(now.getHours() + timeOffsetHours);

      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, "0");
      const date = String(now.getDate()).padStart(2, "0");
      const day = dayNames[now.getDay()];

      const dateDisplay = document.getElementById("date-display");
      if (dateDisplay) dateDisplay.innerText = `${year}. ${month}. ${date} ${day}`;

      let h = now.getHours();
      const m = String(now.getMinutes()).padStart(2, "0");
      const s = String(now.getSeconds()).padStart(2, "0");

      const bgIds = ["bg-dawn", "bg-morning", "bg-noon", "bg-afternoon", "bg-evening", "bg-night"];

      function getThemeIdByHour(hour) {
        if (hour >= 0 && hour < 3) return "bg-night";
        if (hour >= 3 && hour < 7) return "bg-dawn";
        if (hour >= 7 && hour < 12) return "bg-morning";
        if (hour >= 12 && hour < 17) return "bg-noon";
        if (hour >= 17 && hour < 21) return "bg-afternoon";
        return "bg-evening";
      }

      const activeId = getThemeIdByHour(h);
      bgIds.forEach((id) => {
        const el = document.getElementById(id);
        if (!el) return;
        el.style.opacity = id === activeId ? "1" : "0";
      });

      const labelMap = {
        "bg-dawn": "label-dawn",
        "bg-morning": "label-morning",
        "bg-noon": "label-noon",
        "bg-afternoon": "label-afternoon",
        "bg-evening": "label-evening",
        "bg-night": "label-night",
      };

      Object.values(labelMap).forEach((labelId) => {
        const el = document.getElementById(labelId);
        if (!el) return;
        el.style.opacity = labelId === labelMap[activeId] ? "1" : "0";
      });

      h = h === 0 || h === 12 ? h : h % 12;
      const hStr = String(h).padStart(2, "0");

      updateElementWithFade("h1", hStr[0]);
      updateElementWithFade("h2", hStr[1]);
      updateElementWithFade("m1", m[0]);
      updateElementWithFade("m2", m[1]);
      updateElementWithFade("s1", s[0]);
      updateElementWithFade("s2", s[1]);
    }

    setInterval(updateClock, 1000);
    updateClock();

    // UI 컨트롤 및 설정 저장 로직
    const breathing = document.getElementById("crossfade-bg");
    const wrapper = document.getElementById("clock-wrapper");
    const sizeRange = document.getElementById("sizeRange");
    const xRange = document.getElementById("xRange");
    const yRange = document.getElementById("yRange");

    // 저장된 설정 불러오기
    if(localStorage.getItem('clockSize')) sizeRange.value = localStorage.getItem('clockSize');
    if(localStorage.getItem('clockX')) xRange.value = localStorage.getItem('clockX');
    if(localStorage.getItem('clockY')) yRange.value = localStorage.getItem('clockY');

    function addMultiListener(element, events, func) {
      events.split(" ").forEach((e) => element.addEventListener(e, func));
    }

    function updateTransform() {
      const x = xRange.value;
      const y = yRange.value;
      const scale = sizeRange.value;

      wrapper.style.left = x + "%";
      wrapper.style.top = y + "%";
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;

      breathing.style.left = x + "%";
      breathing.style.top = y + "%";
      breathing.style.transform = `translate(-50%, -50%) scale(${scale})`;

      // 설정값 브라우저에 저장
      localStorage.setItem('clockSize', scale);
      localStorage.setItem('clockX', x);
      localStorage.setItem('clockY', y);
    }

    // 초기 적용
    updateTransform();

    addMultiListener(sizeRange, "input change", updateTransform);
    addMultiListener(xRange, "input change", updateTransform);
    addMultiListener(yRange, "input change", updateTransform);

    const controls = document.getElementById("controls");
    const menuBtn = document.getElementById("menu-btn");
    let isMenuOpen = false;

    function toggleMenu() {
      isMenuOpen = !isMenuOpen;
      menuBtn.setAttribute("aria-expanded", String(isMenuOpen));
      if (isMenuOpen) {
        controls.style.display = "block";
        menuBtn.style.display = "none";
      } else {
        controls.style.display = "none";
        menuBtn.style.display = "flex";
        menuBtn.focus();
      }
    }

    // Store a relative position so it remains visible after iPad rotation.
    const menuPositionKey = "clockMenuPosition";
    let menuPosition = null;
    try {
      const saved = JSON.parse(localStorage.getItem(menuPositionKey));
      if (saved && Number.isFinite(saved.x) && Number.isFinite(saved.y)) {
        menuPosition = saved;
      }
    } catch (e) { /* Ignore unavailable storage or invalid saved data. */ }

    function menuBounds() {
      return {
        x: Math.max(0, window.innerWidth - 50),
        y: Math.max(0, window.innerHeight - 50),
      };
    }

    function placeMenu(x, y) {
      const bounds = menuBounds();
      x = Math.max(0, Math.min(bounds.x, x));
      y = Math.max(0, Math.min(bounds.y, y));
      menuBtn.style.right = "auto";
      menuBtn.style.left = x + "px";
      menuBtn.style.top = y + "px";
      return { x: bounds.x ? x / bounds.x : 0, y: bounds.y ? y / bounds.y : 0 };
    }

    function restoreMenuPosition() {
      const bounds = menuBounds();
      if (menuPosition) {
        menuPosition = placeMenu(menuPosition.x * bounds.x, menuPosition.y * bounds.y);
      } else {
        placeMenu(bounds.x - 20, 20);
      }
    }
    restoreMenuPosition();
    window.addEventListener("resize", restoreMenuPosition);

    let drag = null;
    let suppressClick = false;
    menuBtn.addEventListener("pointerdown", (event) => {
      if (!event.isPrimary || event.button !== 0) return;
      const rect = menuBtn.getBoundingClientRect();
      suppressClick = false;
      drag = { id: event.pointerId, x: event.clientX, y: event.clientY,
        left: rect.left, top: rect.top, moved: false };
      menuBtn.setPointerCapture(event.pointerId);
    });
    menuBtn.addEventListener("pointermove", (event) => {
      if (!drag || drag.id !== event.pointerId) return;
      const dx = event.clientX - drag.x;
      const dy = event.clientY - drag.y;
      if (!drag.moved && Math.hypot(dx, dy) < 6) return;
      drag.moved = true;
      suppressClick = true;
      menuPosition = placeMenu(drag.left + dx, drag.top + dy);
    });
    function finishMenuDrag(event) {
      if (!drag || drag.id !== event.pointerId) return;
      if (drag.moved) {
        try { localStorage.setItem(menuPositionKey, JSON.stringify(menuPosition)); }
        catch (e) { /* Dragging still works when storage is unavailable. */ }
      }
      drag = null;
      if (menuBtn.hasPointerCapture(event.pointerId)) {
        menuBtn.releasePointerCapture(event.pointerId);
      }
    }
    menuBtn.addEventListener("pointerup", finishMenuDrag);
    menuBtn.addEventListener("pointercancel", finishMenuDrag);
    menuBtn.addEventListener("lostpointercapture", finishMenuDrag);
    menuBtn.addEventListener("click", (event) => {
      // A drag must not also open settings; keyboard activation still works.
      if (suppressClick && event.detail !== 0) {
        event.preventDefault();
        return;
      }
      toggleMenu();
    });
  </script>
</body>
</html>
